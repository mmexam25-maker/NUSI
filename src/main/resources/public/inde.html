<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NUSI Membership 2026</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>


<!-- HEADER -->
<header class="header">

    <img
      src="/logo.png"
      class="logo"
      alt="NUSI Logo"
    >

    <div class="header-text">

        <div class="header-title">
            NUSI Membership 2026
        </div>

        <div class="header-sub">
            Membership Registration &amp; New Card
        </div>

    </div>

</header>


<div class="notification">

    Please fill the details exactly as per your CDC and upload clear documents.

</div>


<!-- MAIN -->
<div class="main-container">


    <!-- LEFT PANEL -->
    <aside class="left-panel">

        <div class="panel-title">
            Latest Updates
        </div>

        <div class="slider">

            <div id="sliderImages">

                <div class="slider-loading">
                    Loading updates...
                </div>

            </div>

        </div>

    </aside>



    <!-- CENTER -->
    <main class="center-panel">

        <div class="card">

            <h2>
                NUSI NEW MEMBERSHIP FORM
            </h2>


<form id="memberForm">


<!-- NAME -->
<div class="form-row">

<label>
Name As per CDC
</label>

<input
type="text"
id="name"
name="name"
required
oninput="this.value=this.value.replace(/\b\w/g,c=>c.toUpperCase())">

</div>



<!-- CDC -->
<div class="form-row">

<label>
CDC No *
</label>

<input
type="text"
id="cdc"
name="cdc"
required
style="text-transform:uppercase"
oninput="this.value=this.value.toUpperCase()">

</div>



<!-- INDOS -->
<div class="form-row">

<label>
INDoS No *
</label>

<input
type="text"
id="indos"
name="indos"
maxlength="8"
placeholder="12AB3456"
required
style="text-transform:uppercase"
pattern="^[0-9]{2}[A-Z]{2}[0-9]{4}$"
title="Format : 00AA0000"
oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">

</div>



<!-- INDOS PASSWORD -->
<div class="form-row">

<label>
INDoS Password *
</label>

<input
type="password"
id="indosPassword"
name="indosPassword"
placeholder="Enter DG / eSamudra Password"
required
autocomplete="off">

<span class="upload-note">
Used only to obtain photograph from DG Shipping Profile.
</span>

</div>



<!-- DOB -->
<div class="form-row">

    <label>
        Date of Birth *
    </label>


    <div style="
        display:flex;
        align-items:center;
        gap:10px;
    ">

        <input
            type="date"
            id="dob"
            required
            onchange="calculateAge()"
            style="flex:1;">


        <input
            type="text"
            id="age"
            readonly
            placeholder="Age"
            style="
                width:65px;
                text-align:center;
                font-weight:bold;
            ">


        <span
            id="eligibility"
            style="
                font-weight:bold;
                font-size:14px;
                color:#198754;
            ">
        </span>

    </div>

</div>



<!-- BLOOD GROUP -->
<div class="form-row">

<label>
Blood Group *
</label>

<select
id="blood"
name="blood"
required>

<option value="">
Select
</option>

<option>A+ ve</option>
<option>A- ve</option>

<option>B+ ve</option>
<option>B- ve</option>

<option>AB+ ve</option>
<option>AB- ve</option>

<option>O+ ve</option>
<option>O- ve</option>

<option>Not Specified</option>

</select>

</div>



<!-- MOBILE -->
<div class="form-row">

<label>
Mobile No.
</label>

<input
type="tel"
id="mobile"
name="mobile"
maxlength="10"
pattern="[0-9]{10}"
inputmode="numeric"
oninput="this.value=this.value.replace(/\D/g,'')">

</div>



<!-- ALTERNATE MOBILE -->
<div class="form-row">

<label>
Alternate Mobile No.
</label>

<input
type="tel"
id="altmobile"
name="altmobile"
maxlength="10"
pattern="[0-9]{10}"
inputmode="numeric"
oninput="this.value=this.value.replace(/\D/g,'')">

</div>



<!-- EMAIL -->
<div class="form-row">

<label>
Email ID *
</label>

<input
type="email"
id="email"
name="email"
required>

</div>



<!-- ALTERNATE EMAIL -->
<div class="form-row">

<label>
Alternate Email ID
</label>

<input
type="email"
id="altemail"
name="altemail">

</div>



<!-- ADDRESS 1 -->
<div class="form-row">

<label>
Address Line 1 *
</label>

<input
type="text"
id="address1"
name="address1"
required>

</div>



<!-- ADDRESS 2 -->
<div class="form-row">

<label>
Address Line 2
</label>

<input
type="text"
id="address2"
name="address2">

</div>



<!-- ADDRESS 3 -->
<div class="form-row">

<label>
Address Line 3
</label>

<input
type="text"
id="address3"
name="address3">

</div>



<!-- PINCODE -->
<div class="form-row">

<label>
Pincode *
</label>

<input
type="text"
id="pincode"
name="pincode"
maxlength="6"
required
pattern="[0-9]{6}"
inputmode="numeric"
oninput="this.value=this.value.replace(/\D/g,'')">

</div>



<!-- STATE -->
<div class="form-row">

<label>
State *
</label>


<select
id="state"
name="state"
required>

<option value="">
-- Select --
</option>

<option>ANDAMAN &amp; NICOBAR ISLANDS</option>
<option>ANDHRA PRADESH</option>
<option>ARUNACHAL PRADESH</option>
<option>ASSAM</option>
<option>BIHAR</option>
<option>CHANDIGARH</option>
<option>CHHATTISGARH</option>
<option>DADRA &amp; NAGAR HAVELI</option>
<option>DAMAN AND DIU</option>
<option>GOA</option>
<option>GUJARAT</option>
<option>HARYANA</option>
<option>HIMACHAL PRADESH</option>
<option>JAMMU &amp; KASHMIR</option>
<option>JHARKHAND</option>
<option>KARNATAKA</option>
<option>KERALA</option>
<option>LADAKH</option>
<option>LAKSHADWEEP</option>
<option>MADHYA PRADESH</option>
<option>MAHARASHTRA</option>
<option>MANIPUR</option>
<option>MEGHALAYA</option>
<option>MINICOY ISLANDS</option>
<option>MIZORAM</option>
<option>NAGALAND</option>
<option>NEW DELHI</option>
<option>ODISHA</option>
<option>PUDUCHERRY</option>
<option>PUNJAB</option>
<option>RAJASTHAN</option>
<option>SIKKIM</option>
<option>TAMIL NADU</option>
<option>TELANGANA</option>
<option>TRIPURA</option>
<option>UTTAR PRADESH</option>
<option>UTTARAKHAND</option>
<option>UTTARANCHAL</option>
<option>WEST BENGAL</option>

</select>

</div>



<!-- CITY -->
<div class="form-row">

<label>
City *
</label>

<input
type="text"
id="city"
name="city"
required>

</div>



<!-- RANK -->
<div class="form-row">

<label>
Rank *
</label>


<select
id="rank"
name="rank"
required>

<option value="">
-- Select --
</option>

<option>ABLE BODIED SEAMAN</option>
<option>BOSUN</option>
<option>CHIEF COOK</option>
<option>COOK</option>
<option>CRANE OPERATOR</option>
<option>CRUISE STAFF</option>
<option>DECK FITTER</option>
<option>ELECTRICIAN</option>
<option>ENGINE ROOM FITTER</option>
<option>ENGINE ROOM RATING</option>
<option>FITTER</option>
<option>GENERAL STEWARD</option>
<option>MESSMAN</option>
<option>MOTORMAN</option>
<option>NUSI STAFF</option>
<option>OILER</option>
<option>ORDINARY SEAMAN</option>
<option>PAINTER</option>
<option>PUMPMAN</option>
<option>SEAMAN</option>
<option>TRAINEE</option>
<option>WELDER</option>
<option>OTHER</option>

</select>

</div>



<!-- PASSPORT -->
<div class="form-row">

<label>

Passport Upload *

<span class="upload-note">

Attach Passport PDF
(Name Page + Address Page combined into one PDF)

</span>

</label>


<input
type="file"
id="passport"
name="passport"
accept=".pdf"
required>

</div>



<!-- CDC -->
<div class="form-row upload-block">

<label>

CDC Upload *

<br>

<span class="upload-note">

Attach your CDC in PDF format
(Name Page + Address Page combined into one PDF)

</span>

</label>


<input
type="file"
id="cdcfile"
name="cdcfile"
accept=".pdf"
required>

</div>



<!-- SUBMIT -->
<div class="center">

<button
type="submit"
class="btn"
id="submitBtn">

Submit Membership

</button>

</div>



<!-- LOADING -->
<div
id="loading"
style="
display:none;
margin-top:20px;
">

<div class="loader"></div>

<center>
Please wait...
</center>

</div>


</form>

        </div>

    </main>


</div>


<script src="/script.js"></script>

</body>

</html>
